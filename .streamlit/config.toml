# Giao diện: nền sáng + xanh nước biển, font Be Vietnam Pro (hiển thị đủ dấu tiếng Việt).
# Luôn dùng giao diện sáng (không có bản tối), kể cả khi hệ điều hành của người xem đang bật chế độ tối.
[theme]
base = "light"
font = "Be Vietnam Pro:https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
baseRadius = "10px"
showWidgetBorder = true
metricValueFontSize = "1.6rem"
metricValueFontWeight = 700
headingFontWeights = [700, 700, 600, 600, 600, 600]
headingFontSizes = ["1.75rem", "1.5rem", "1.3rem"]
primaryColor = "#0369A1"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#EEF2F6"
textColor = "#0F172A"
borderColor = "#D5DCE5"
linkColor = "#0369A1"
redColor = "#DC2626"
greenColor = "#15803D"
dataframeHeaderBackgroundColor = "#EEF2F6"
# Màu loạt dữ liệu của biểu đồ, thứ tự cố định (đã kiểm tra mù màu trên nền #f8fafc)
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#4a3aa7", "#e34948"]

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F5F9"

[server]
maxUploadSize = 100

[browser]
gatherUsageStats = false
